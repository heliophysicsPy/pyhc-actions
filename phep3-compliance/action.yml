# action.yml
name: "PHEP 3 Compliance Checker"
description: "Check package compliance with PHEP 3 (Python/package version support policy)"
author: PyHC Community

branding:
  icon: "check-square"
  color: "blue"

inputs:
  project-file:
    description: "Path to pyproject.toml file"
    required: false
    default: "pyproject.toml"
  fail-on-warning:
    description: "Treat warnings as errors"
    required: false
    default: "false"
  check-adoption:
    description: "Check 6-month adoption rule for new versions"
    required: false
    default: "true"
  schedule-path:
    description: "Path to schedule.json file (optional, will download if missing)"
    required: false
    default: ""
  use-uv-fallback:
    description: "Use uv metadata extraction for projects with non-PEP 621 metadata (including setup.py/setup.cfg)"
    required: false
    default: "true"
  ignore-errors-for:
    description: "Comma-separated list of package names to treat errors as warnings"
    required: false
    default: ""

outputs:
  passed:
    description: "Whether the check passed"
    value: ${{ steps.check.outputs.passed }}
  errors:
    description: "Number of errors found"
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: "Number of warnings found"
    value: ${{ steps.check.outputs.warnings }}

runs:
  using: "composite"
  steps:
    - name: Download schedule.json
      if: ${{ inputs.schedule-path == '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # Try to download from PyHC releases, fall back to generating
        SCHEDULE_URL="https://github.com/heliophysicsPy/pyhc-actions/releases/latest/download/schedule.json"
        if curl -fsSL "$SCHEDULE_URL" -o "$ACTION_PATH/../schedule.json" 2>/dev/null; then
          echo "Downloaded schedule.json from releases"
        else
          echo "Could not download schedule.json, will use built-in Python schedule"
        fi

    - name: Compute minimum PHEP 3 Python version
      id: python-version
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCHEDULE_PATH: ${{ inputs.schedule-path }}
      run: |
        # Determine which schedule file to use
        SCHEDULE_FILE=""
        if [ -n "$SCHEDULE_PATH" ]; then
          SCHEDULE_FILE="$SCHEDULE_PATH"
        elif [ -f "$ACTION_PATH/../schedule.json" ]; then
          SCHEDULE_FILE="$ACTION_PATH/../schedule.json"
        fi

        if [ -n "$SCHEDULE_FILE" ] && [ -f "$SCHEDULE_FILE" ]; then
          # Extract minimum Python version from schedule.json
          MIN_PYTHON=$(python3 "$ACTION_PATH/get_min_python.py" "$SCHEDULE_FILE" 2>/dev/null || echo "3.12")
        else
          MIN_PYTHON="3.12"
        fi

        echo "Using Python $MIN_PYTHON (minimum PHEP 3 supported version)"
        echo "version=$MIN_PYTHON" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ steps.python-version.outputs.version }}

    - name: Install uv
      if: ${{ inputs.use-uv-fallback == 'true' }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # Keep in sync with pyhc-env-compat/action.yml and the integration test.
        version: "0.11.28"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install packaging tomlkit requests

    - name: Run PHEP 3 compliance check
      id: check
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../src
        ACTION_PATH: ${{ github.action_path }}
        SCHEDULE_PATH: ${{ inputs.schedule-path }}
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        CHECK_ADOPTION: ${{ inputs.check-adoption }}
        USE_UV_FALLBACK: ${{ inputs.use-uv-fallback }}
        IGNORE_ERRORS_FOR: ${{ inputs.ignore-errors-for }}
        PROJECT_FILE: ${{ inputs.project-file }}
      run: |
        CHECK_ARGS=()
        if [ -n "$SCHEDULE_PATH" ]; then
          CHECK_ARGS+=(--schedule "$SCHEDULE_PATH")
        elif [ -f "$ACTION_PATH/../schedule.json" ]; then
          CHECK_ARGS+=(--schedule "$ACTION_PATH/../schedule.json")
        fi

        if [ "$FAIL_ON_WARNING" = "true" ]; then
          CHECK_ARGS+=(--fail-on-warning)
        fi
        if [ "$CHECK_ADOPTION" = "false" ]; then
          CHECK_ARGS+=(--no-adoption-check)
        fi
        if [ "$USE_UV_FALLBACK" = "false" ]; then
          CHECK_ARGS+=(--no-uv-fallback)
        fi
        if [ -n "$IGNORE_ERRORS_FOR" ]; then
          CHECK_ARGS+=(--ignore-errors-for "$IGNORE_ERRORS_FOR")
        fi

        CHECK_ARGS+=("$PROJECT_FILE")
        # `shell: bash` runs with `-e`, so guard the call to keep the failure
        # branch below reachable instead of aborting the step immediately.
        EXIT_CODE=0
        python -m pyhc_actions.phep3.main "${CHECK_ARGS[@]}" || EXIT_CODE=$?

        if [ $EXIT_CODE -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

        exit $EXIT_CODE

# action.yml
name: "PyHC Environment Compatibility Checker"
description: "Check package compatibility with PyHC Environment dependencies"
author: PyHC Community

branding:
  icon: "layers"
  color: "green"

inputs:
  project-file:
    description: "Path to pyproject.toml file"
    required: false
    default: "pyproject.toml"
  pyhc-packages-url:
    description: "URL to PyHC Environment packages.txt"
    required: false
    default: "https://raw.githubusercontent.com/heliophysicsPy/pyhc-docker-environment/main/docker/pyhc-environment/contents/packages.txt"
  pyhc-constraints-url:
    description: "URL to PyHC Environment constraints.txt"
    required: false
    default: "https://raw.githubusercontent.com/heliophysicsPy/pyhc-docker-environment/main/docker/pyhc-environment/contents/constraints.txt"
  extras:
    description: "Extras selection: auto | none | comma-separated list (e.g., mth5,vires)"
    required: false
    default: "auto"

outputs:
  compatible:
    description: "Whether the package is compatible with PyHC Environment"
    value: ${{ steps.check.outputs.compatible }}
  conflicts:
    description: "Number of conflicts found"
    value: ${{ steps.check.outputs.conflicts }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        # Keep in sync with phep3-compliance/action.yml and the integration test.
        version: "0.11.28"
        enable-cache: true

    - name: Verify uv installation
      shell: bash
      run: |
        uv --version

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install packaging tomlkit requests pyyaml

    - name: Run PyHC compatibility check
      id: check
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../src
        PACKAGES_URL: ${{ inputs.pyhc-packages-url }}
        CONSTRAINTS_URL: ${{ inputs.pyhc-constraints-url }}
        EXTRAS: ${{ inputs.extras }}
        PROJECT_FILE: ${{ inputs.project-file }}
      run: |
        # Ensure git history/tags are available for setuptools_scm versioning
        if [ -d .git ]; then
          if git rev-parse --is-shallow-repository >/dev/null 2>&1; then
            git fetch --quiet --unshallow --tags --force --prune
          else
            git fetch --quiet --tags --force --prune
          fi
        fi

        CHECK_ARGS=()
        if [ -n "$PACKAGES_URL" ]; then
          CHECK_ARGS+=(--packages "$PACKAGES_URL")
        fi
        if [ -n "$CONSTRAINTS_URL" ]; then
          CHECK_ARGS+=(--constraints "$CONSTRAINTS_URL")
        fi
        if [ -n "$EXTRAS" ]; then
          CHECK_ARGS+=(--extras "$EXTRAS")
        fi

        # `shell: bash` runs with `-e`, so guard the call to keep the failure
        # branch below reachable instead of aborting the step immediately.
        EXIT_CODE=0
        python -m pyhc_actions.env_compat.main "${CHECK_ARGS[@]}" "$PROJECT_FILE" || EXIT_CODE=$?

        if [ $EXIT_CODE -eq 0 ]; then
          echo "compatible=true" >> "$GITHUB_OUTPUT"
          # conflicts output is populated by pyhc_actions.env_compat.main
        else
          echo "compatible=false" >> "$GITHUB_OUTPUT"
        fi

        exit $EXIT_CODE

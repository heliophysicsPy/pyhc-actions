name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging tomlkit requests

      - name: Generate fresh schedule.json
        env:
          PYTHONPATH: src
        run: |
          python -c "from pyhc_actions.phep3.pypi_fetcher import update_schedule_file; update_schedule_file('schedule.json')"

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            schedule.json
          body: |
            ## PyHC Actions ${{ github.ref_name }}

            ### Usage

            **PHEP 3 Compliance Checker:**
            ```yaml
            - uses: heliophysicsPy/pyhc-actions/phep3-compliance@${{ github.ref_name }}
            ```

            **PyHC Environment Compatibility Checker:**
            ```yaml
            - uses: heliophysicsPy/pyhc-actions/pyhc-env-compat@${{ github.ref_name }}
            ```

            ### Included Files
            - `schedule.json` - Current release schedule for Python and core Scientific Python packages

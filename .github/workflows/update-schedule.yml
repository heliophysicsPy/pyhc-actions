name: Update Schedule

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials are deliberately persisted here: the final step pushes the
      # regenerated schedule.json back to this branch.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging tomlkit requests

      - name: Generate schedule
        env:
          PYTHONPATH: src
        run: |
          python -c "from pyhc_actions.phep3.pypi_fetcher import update_schedule_file; update_schedule_file('schedule.json')"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet schedule.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add schedule.json
          git commit -m "chore: update schedule.json with latest release dates"
          git push origin "HEAD:$TARGET_REF"
